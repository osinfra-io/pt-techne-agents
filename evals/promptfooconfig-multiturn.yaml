# Nomos Agent Multi-turn Evals
#
# Run:  cd pt-techne-agents && promptfoo eval -c evals/promptfooconfig-multiturn.yaml --no-cache
# View: promptfoo view

description: Nomos Agent multi-turn eval suite — covers sequential workflow flows

prompts:
  - id: multiturn
    raw: |
      [
        {"role": "system", "content": {{systemPrompt | dump}}}
        {%- for msg in conversation %},
        {{ msg | dump }}
        {%- endfor %}
        {%- for msg in continuation %},
        {{ msg | dump }}
        {%- endfor %}
      ]

defaultTest:
  vars:
    systemPrompt: file://../.github/agents/nomos.agent.md

providers:
  - file://providers.yaml

# ─────────────────────────────────────────────────────────────────────────────
# Helper: extract tool names and text from output
# ─────────────────────────────────────────────────────────────────────────────
# Claude may return tool_use blocks as stringified JSON or native objects.
# Helper pattern used in each assertion:
#   const raw = typeof output === 'string' ? output : JSON.stringify(output);
#   const calls = Array.isArray(output) ? output : (output?.tool_calls || output?.content?.filter?.(c => c.type === 'tool_use') || []);
#   const names = [...new Set([...calls.map(c => c.function?.name || c.name).filter(Boolean), ...[...raw.matchAll(/"name"\s*:\s*"([^"]+)"/g)].map(m => m[1])])];
#   const text = typeof output === 'string' ? output : (Array.isArray(output?.content) ? output.content.filter(c => c.type === 'text').map(c => c.text).join(' ') : (output?.content || ''));

tests:
  - description: "Startup context: includes declared Authentik groups and environments alongside existing systems"
    vars:
      conversation:
        - role: user
          content: "Show my team memberships. My identity and organization membership have already been validated."
        - role: assistant
          content:
            - type: tool_use
              id: toolu_github
              name: lookup_user
              input:
                github_username: alice-dev
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolu_github
              content: '{"matches":[{"team_key":"pt-pneuma","via":"github_username","system":"github","scope":"team-parent","membership":"member"}]}'
        - role: assistant
          content:
            - type: tool_use
              id: toolu_email
              name: lookup_user
              input:
                email: alice@osinfra.io
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolu_email
              content: '{"matches":[{"team_key":"pt-pneuma","via":"email","system":"authentik","scope":"application","subject":"agentgateway-admins/sandbox","membership":"member"}]}'
        - role: assistant
          content:
            - type: tool_use
              id: toolu_team
              name: get_team
              input:
                team_key: pt-pneuma
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolu_team
              content: '{"spec":{"team_key":"pt-pneuma","display_name":"Pneuma","authentik_groups":{"agentgateway-admins":{"label":"agentgateway Admins","description":"agentgateway UI access","members":{"sandbox":["alice@osinfra.io"]}}}}}'
    assert:
      - type: javascript
        value: |
          const content = Array.isArray(output) ? output : output?.content;
          const text = typeof output === 'string' ? output : (Array.isArray(content) ? content.filter(c => c.type === 'text').map(c => c.text).join('\n') : (typeof content === 'string' ? content : ''));
          const rows = text.split('\n').filter(line => /^\s*\|/.test(line));
          const header = rows.find(line => ['Team', 'GitHub', 'Datadog', 'Google Cloud Platform', 'Authentik'].every(name => line.includes(name)));
          return Boolean(header) && rows.some(line => line.includes('pt-pneuma: agentgateway Admins') && line.includes('sandbox'));

  # ═══════════════════════════════════════════════════════════════════════════
  # TEST 1: ONBOARD — after identity lookup, asks for team key (no PR)
  # ═══════════════════════════════════════════════════════════════════════════

  - description: "Multi-turn onboard: after identity lookup, asks for team key — no premature PR, no question bundling"
    vars:
      conversation:
        - role: user
          content: Hi, I want to onboard a new team.
        - role: assistant
          content:
            - type: text
              text: "👋 Hi! I'm the Nomos Agent — your self-serve interface to the osinfra.io platform. Give me just a moment while I look you up…"
            - type: tool_use
              id: toolu_01
              name: get_me
              input: {}
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolu_01
              content: '{"login":"alice-dev","email":"alice@osinfra.io"}'
        - role: assistant
          content:
            - type: tool_use
              id: toolu_02
              name: lookup_user
              input:
                github_username: alice-dev
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolu_02
              content: '{"matches":[]}'
        - role: assistant
          content:
            - type: tool_use
              id: toolu_03
              name: lookup_user
              input:
                email: alice@osinfra.io
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolu_03
              content: '{"matches":[]}'
        - role: assistant
          content: "Welcome to the platform! I don't see you on any existing teams yet. Would you like to join an existing team or onboard a new one?"
        - role: user
          content: I'd like to onboard a new team.
    assert:
      - type: javascript
        value: |
          const calls = Array.isArray(output) ? output : (output?.tool_calls || output?.content?.filter?.(c => c.type === 'tool_use') || []);
          const raw = typeof output === 'string' ? output : JSON.stringify(output);
          const names = [...new Set([...calls.map(c => c.function?.name || c.name).filter(Boolean), ...[...raw.matchAll(/"name"\s*:\s*"([^"]+)"/g)].map(m => m[1])])];
          return !names.includes('open_team_pr');
      - type: javascript
        value: |
          const _content = Array.isArray(output) ? output : output?.content;
          const text = typeof output === 'string' ? output : (Array.isArray(_content) ? _content.filter(c => c.type === 'text').map(c => c.text).join(' ') : (typeof _content === 'string' ? _content : ''));
          const lower = text.toLowerCase();
          return lower.includes('team') || lower.includes('key') || lower.includes('name') || lower.includes('onboard');
      - type: javascript
        value: |
          // No question bundling — asking for team key should not also ask about Datadog, GitHub, or Google groups
          const _content = Array.isArray(output) ? output : output?.content;
          const text = typeof output === 'string' ? output : (Array.isArray(_content) ? _content.filter(c => c.type === 'text').map(c => c.text).join(' ') : (typeof _content === 'string' ? _content : ''));
          const hasDatadog = /datadog/i.test(text);
          const hasGitHub = /github\s+(username|maintainer|member)/i.test(text);
          const hasGoogle = /google\s+(group|cloud|identity)/i.test(text);
          return [hasDatadog, hasGitHub, hasGoogle].filter(Boolean).length === 0;

  # ═══════════════════════════════════════════════════════════════════════════
  # TEST 2: ONBOARD — all required fields collected, optional menu shown (no PR)
  # ═══════════════════════════════════════════════════════════════════════════

  - description: "Multi-turn onboard: all required fields collected — optional menu or summary shown, no PR"
    vars:
      conversation:
        - role: user
          content: I want to onboard a new team.
        - role: assistant
          content:
            - type: text
              text: "👋 Hi! I'm the Nomos Agent. Give me a moment while I look you up…"
            - type: tool_use
              id: toolu_01
              name: get_me
              input: {}
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolu_01
              content: '{"login":"alice-dev","email":"alice@osinfra.io"}'
        - role: assistant
          content:
            - type: tool_use
              id: toolu_02
              name: lookup_user
              input:
                github_username: alice-dev
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolu_02
              content: '{"matches":[]}'
        - role: assistant
          content:
            - type: tool_use
              id: toolu_03
              name: lookup_user
              input:
                email: alice@osinfra.io
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolu_03
              content: '{"matches":[]}'
        - role: assistant
          content: Welcome! You're not on any teams yet. Would you like to onboard a new team or join an existing one?
        - role: user
          content: "Onboard a new team — the key is st-nova."
        - role: assistant
          content: "I'll use **Nova** as the display name for **st-nova** (stream-aligned team). Does that sound right, and can you give me a brief description of the team?"
        - role: user
          content: "Yes, Nova is fine. Description: Nova team for stream-aligned delivery workloads."
        - role: assistant
          content: Got it. What email address(es) should be Datadog admins for st-nova? (@osinfra.io addresses)
        - role: user
          content: alice@osinfra.io
        - role: assistant
          content: Got it — alice@osinfra.io as Datadog admin. Who should be the GitHub parent team maintainers? (GitHub usernames)
        - role: user
          content: alice-dev
        - role: assistant
          content: "Got it. For the Google Cloud Identity groups, there are nine groups (admin, reader, and writer × sandbox, non-production, production). Should the membership be the same in all environments, or would you like to configure each environment separately?"
        - role: user
          content: Same in all environments — alice@osinfra.io as owner for all groups.
        - role: assistant
          content: "Who should have OpenBao Secret Reader access in sandbox, non-production, and production? This is separate from Google IAM; I won't reuse those memberships unless you explicitly confirm the same members."
        - role: user
          content: No readers for now.
        - role: assistant
          content: "Who should have OpenBao Secret Writer access in sandbox, non-production, and production? Empty membership is allowed."
        - role: user
          content: No writers for now.
        - role: assistant
          content: "Who should have OpenBao Secret Admin access in sandbox, non-production, and production? Admin access is limited to this team's secrets."
        - role: user
          content: No admins for now.
        - role: assistant
          content: >-
            ✅ Required fields are all set for **st-nova**:
            - Datadog admin: alice@osinfra.io
            - GitHub maintainer: alice-dev
            - Google groups owners (admin/reader/writer, all environments): alice@osinfra.io
            - OpenBao Secret Readers: none in all environments
            - OpenBao Secret Writers: none in all environments
            - OpenBao Secret Admins: none in all environments

            Would you like to configure any optional enhancements — GitHub Actions/OIDC, repositories,
            GKE clusters, Cloud SQL, or additional GCP projects — or proceed straight to the summary?
        - role: user
          content: Skip the optional enhancements and show me the summary.
    assert:
      - type: javascript
        value: |
          const calls = Array.isArray(output) ? output : (output?.tool_calls || output?.content?.filter?.(c => c.type === 'tool_use') || []);
          const raw = typeof output === 'string' ? output : JSON.stringify(output);
          const names = [...new Set([...calls.map(c => c.function?.name || c.name).filter(Boolean), ...[...raw.matchAll(/"name"\s*:\s*"([^"]+)"/g)].map(m => m[1])])];
          return !names.includes('open_team_pr');
      - type: javascript
        value: |
          const _content = Array.isArray(output) ? output : output?.content;
          const text = typeof output === 'string' ? output : (Array.isArray(_content) ? _content.filter(c => c.type === 'text').map(c => c.text).join(' ') : (typeof _content === 'string' ? _content : ''));
          const lower = text.toLowerCase();
          return lower.includes('st-nova') || lower.includes('nova') || lower.includes('summary') || lower.includes('confirm') || lower.includes('proceed');
      - type: javascript
        value: |
          const _content = Array.isArray(output) ? output : output?.content;
          const text = typeof output === 'string' ? output : (Array.isArray(_content) ? _content.filter(c => c.type === 'text').map(c => c.text).join(' ') : (typeof _content === 'string' ? _content : ''));
          const lower = text.toLowerCase();
          // Accept either explicit enumeration of roles/envs OR shorthand references
          const hasRoles = ['admin', 'reader', 'writer'].every(r => lower.includes(r));
          const hasEnvs = ['sandbox', 'non-production', 'production'].every(e => lower.includes(e));
          const hasAllEnvs = lower.includes('all environments') || lower.includes('all three environments') || lower.includes('same') || lower.includes('across all');
          const hasShorthand = (lower.includes('all groups') || lower.includes('all nine') || lower.includes('google groups') || lower.includes('google cloud identity')) && lower.includes('owner');
          return (hasRoles && (hasEnvs || hasAllEnvs)) || hasShorthand;

  - description: "Multi-turn onboard: asks for OpenBao access separately per environment"
    vars:
      conversation:
        - role: user
          content: "Onboard a new team."
        - role: assistant
          content:
            - type: text
              text: "Hi! I'm the Nomos Agent. Give me a moment while I look you up."
            - type: tool_use
              id: toolu_openbao_identity
              name: get_me
              input: {}
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolu_openbao_identity
              content: '{"login":"alice-dev","email":"alice@osinfra.io"}'
        - role: assistant
          content:
            - type: tool_use
              id: toolu_openbao_github
              name: lookup_user
              input:
                github_username: alice-dev
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolu_openbao_github
              content: '{"matches":[]}'
        - role: assistant
          content:
            - type: tool_use
              id: toolu_openbao_email
              name: lookup_user
              input:
                email: alice@osinfra.io
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolu_openbao_email
              content: '{"matches":[]}'
        - role: assistant
          content: "What is the team key and display name?"
        - role: user
          content: "Team key st-nova, display name Nova."
        - role: assistant
          content:
            - type: tool_use
              id: toolu_openbao_team_key
              name: get_file_contents
              input:
                owner: osinfra-io
                repo: pt-logos
                path: .github/workflows/production.yml
                ref: main
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolu_openbao_team_key
              content: '{"type":"file","path":".github/workflows/production.yml","content":"jobs:\n  main:\n    strategy:\n      matrix:\n        teams: [pt-logos, pt-pneuma]\n"}'
        - role: assistant
          content: "The key st-nova is available. Nova is a stream-aligned team. What is the team description?"
        - role: user
          content: "Nova team for stream-aligned delivery workloads."
        - role: assistant
          content: "Who should be the Datadog admin?"
        - role: user
          content: "alice@osinfra.io"
        - role: assistant
          content: "Who should maintain the GitHub parent team?"
        - role: user
          content: "alice-dev"
        - role: assistant
          content:
            - type: tool_use
              id: toolu_openbao_maintainer
              name: search_users
              input:
                query: alice-dev
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolu_openbao_maintainer
              content: '{"total_count":1,"items":[{"login":"alice-dev","type":"User"}]}'
        - role: assistant
          content: "Should the Google Cloud Identity group membership be the same in all environments?"
        - role: user
          content: "Yes, alice@osinfra.io as owner for all Google roles in sandbox, non-production, and production."
    assert:
      - type: javascript
        value: |
          const calls = Array.isArray(output) ? output : (output?.tool_calls || output?.content?.filter?.(c => c.type === 'tool_use') || []);
          const raw = typeof output === 'string' ? output : JSON.stringify(output);
          const names = [...new Set([...calls.map(c => c.function?.name || c.name).filter(Boolean), ...[...raw.matchAll(/"name"\s*:\s*"([^"]+)"/g)].map(m => m[1])])];
          return !names.includes('open_team_pr');
      - type: llm-rubric
        provider:
          id: anthropic:messages:claude-sonnet-4-6
          config:
            temperature: 0
        value: >-
          The user confirmed alice@osinfra.io as owner of all Google IAM roles in
          sandbox, non-production, and production. They have not provided or
          confirmed ANY OpenBao membership. The response must actually ask who
          should be OpenBao Secret Readers, requesting membership separately for
          sandbox, non-production, and production. Empty lists must be permitted.
          It must not assign or announce copying Google members or one
          environment's members into another without explicit confirmation.
          Asking whether the user wants the same membership is allowed; assuming
          that answer is not. Explaining writer/admin permissions is allowed,
          but asking for writer/admin membership instead of reader membership,
          or collecting multiple access groups in this turn, fails.
          A statement mentioning readers followed only by a writer question
          fails, even if all three environments are named elsewhere.

  # ═══════════════════════════════════════════════════════════════════════════
  # TEST 3: ONBOARD — explicit "yes" after summary triggers PR creation
  # ═══════════════════════════════════════════════════════════════════════════

  - description: "Multi-turn onboard: explicit confirmation after summary — open_team_pr and open_team_docs_pr are called"
    vars:
      openbaoMembers:
        readers: {sandbox: [], non-production: [], production: []}
        writers: {sandbox: [], non-production: [], production: []}
        admins: {sandbox: [], non-production: [], production: []}
      conversation: &confirmed_onboarding
        - role: user
          content: I want to onboard a new team.
        - role: assistant
          content:
            - type: text
              text: "👋 Hi! I'm the Nomos Agent. Give me a moment while I look you up…"
            - type: tool_use
              id: toolu_01
              name: get_me
              input: {}
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolu_01
              content: '{"login":"alice-dev","email":"alice@osinfra.io"}'
        - role: assistant
          content:
            - type: tool_use
              id: toolu_02
              name: lookup_user
              input:
                github_username: alice-dev
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolu_02
              content: '{"matches":[]}'
        - role: assistant
          content:
            - type: tool_use
              id: toolu_03
              name: lookup_user
              input:
                email: alice@osinfra.io
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolu_03
              content: '{"matches":[]}'
        - role: assistant
          content: Welcome! Let's get your team registered. You're not on any teams yet.
        - role: user
          content: "Team key: st-nova. Display name: Nova. Description: Nova team for stream-aligned delivery workloads."
        - role: assistant
          content: Got it — **st-nova** ("Nova"), stream-aligned team. What email address(es) should be Datadog admins?
        - role: user
          content: alice@osinfra.io
        - role: assistant
          content: Got it. Who should be the GitHub parent team maintainers?
        - role: user
          content: alice-dev
        - role: assistant
          content: "Got it. For the nine Google Cloud Identity groups (admin, reader, writer × sandbox, non-production, production) — should the membership be the same in all environments?"
        - role: user
          content: Yes — alice@osinfra.io as owner for all groups in all environments.
        - role: assistant
          content: "Who should have OpenBao Secret Reader access in sandbox, non-production, and production? This is separate from Google IAM; I won't reuse those memberships unless you explicitly confirm the same members."
        - role: user
          content: No readers for now.
        - role: assistant
          content: "Who should have OpenBao Secret Writer access in sandbox, non-production, and production? Empty membership is allowed."
        - role: user
          content: No writers for now.
        - role: assistant
          content: "Who should have OpenBao Secret Admin access in sandbox, non-production, and production? Admin access is limited to this team's secrets."
        - role: user
          content: No admins for now.
        - role: assistant
          content: No optional enhancements — proceeding to summary.
        - role: user
          content: Yes, skip optional enhancements.
        - role: assistant
          content: >-
            Here's a summary of what I'll create for **st-nova**:

            | Field | Value |
            |-------|-------|
            | Team key | st-nova |
            | Team type | stream-aligned |
            | Display name | Nova |
            | Description | Nova team for stream-aligned delivery workloads |
            | Datadog admin | alice@osinfra.io |
            | GitHub maintainer | alice-dev |
            | Google groups owners | alice@osinfra.io (admin/reader/writer, all environments) |
            | OpenBao Secret Readers | None in all environments |
            | OpenBao Secret Writers | None in all environments |
            | OpenBao Secret Admins | None in all environments |

            This will open three pull requests: **PR 1** adds the GitHub environment to pt-logos,
            **PR 2** onboards the team, and **PR 3** creates the docs page.

            Shall I go ahead?
        - role: user
          content: "Yes, go ahead and create the PRs."
        - role: assistant
          content:
            - type: text
              text: "On it! First, let me retrieve the pt-logos spec to add the GitHub environment (PR 1)."
            - type: tool_use
              id: toolu_10
              name: get_team
              input:
                team_key: pt-logos
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolu_10
              content: '{"team_key":"pt-logos","team_type":"platform","display_name":"Logos","display_name_comment":"Creates foundational platform resources","datadog_admin_email_addresses":["platform@osinfra.io"],"github_parent_team_maintainers":["admin-dev"],"google_groups_owner_email_addresses":{"admin":["platform@osinfra.io"],"reader":["platform@osinfra.io"],"writer":["platform@osinfra.io"]},"github_repositories":{"pt-logos":{"environments":["main-production"]}}}'
        - role: assistant
          content:
            - type: tool_use
              id: toolu_11
              name: open_team_pr
              input:
                spec:
                  team_key: pt-logos
                  team_type: platform
                  display_name: Logos
                  display_name_comment: Creates foundational platform resources
                  datadog_admin_email_addresses: [platform@osinfra.io]
                  github_parent_team_maintainers: [admin-dev]
                  google_groups_owner_email_addresses:
                    admin: [platform@osinfra.io]
                    reader: [platform@osinfra.io]
                    writer: [platform@osinfra.io]
                  github_repositories:
                    pt-logos:
                      environments: [main-production]
                    st-nova:
                      environments: [main-production]
                branch: "onboard/st-nova-environment"
                labels: ["nomos"]
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolu_11
              content: '{"action":"created","branch":"onboard/st-nova-environment","pr_url":"https://github.com/osinfra-io/pt-logos/pull/100"}'
        - role: assistant
          content:
            - type: tool_use
              id: toolu_onboard_matrix
              name: get_file_contents
              input:
                owner: osinfra-io
                repo: pt-logos
                path: .github/workflows/production.yml
                ref: main
            - type: tool_use
              id: toolu_onboard_schema
              name: get_file_contents
              input:
                owner: osinfra-io
                repo: pt-techne-mcp-server
                path: schema/team.schema.json
                ref: main
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolu_onboard_matrix
              content: '{"type":"file","path":".github/workflows/production.yml","content":"jobs:\n  main:\n    strategy:\n      matrix:\n        teams: [pt-logos, pt-pneuma]\n"}'
            - type: tool_result
              tool_use_id: toolu_onboard_schema
              content: >-
                Relevant schema excerpt:
                {"required":["team_key","team_type","display_name","display_name_comment","datadog_team_memberships","github_parent_team_memberships","google_basic_groups_env_memberships"],
                "properties":{"team_key":{"type":"string"},"team_type":{"enum":["platform-team","stream-aligned-team","complicated-subsystem-team","enabling-team"]},
                "display_name":{"type":"string"},"display_name_comment":{"type":"string"},
                "datadog_team_memberships":{"type":"object","required":["admins","members"],"properties":{"admins":{"type":"array","items":{"type":"string"}},"members":{"type":"array","items":{"type":"string"}}}},
                "github_parent_team_memberships":{"$ref":"#/$defs/githubMembership"},
                "google_basic_groups_env_memberships":{"type":"object","required":["admin","reader","writer"],"properties":{"admin":{"$ref":"#/$defs/envScopedGoogleGroups"},"reader":{"$ref":"#/$defs/envScopedGoogleGroups"},"writer":{"$ref":"#/$defs/envScopedGoogleGroups"}}},
                "authentik_groups":{"type":"object","additionalProperties":{"type":"object","required":["description","label"],"properties":{"description":{"type":"string"},"label":{"type":"string"},"members":{"type":"object","description":"Explicit member emails per environment. Omitted environments have no members.","properties":{"sandbox":{"type":"array","items":{"type":"string"}},"non-production":{"type":"array","items":{"type":"string"}},"production":{"type":"array","items":{"type":"string"}}}}}}}},
                "$defs":{"githubMembership":{"type":"object","required":["maintainers","members"],"properties":{"maintainers":{"type":"array","items":{"type":"string"}},"members":{"type":"array","items":{"type":"string"}}}},

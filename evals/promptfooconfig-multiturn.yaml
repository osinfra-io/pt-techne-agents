  # ═══════════════════════════════════════════════════════════════════════════

  - description: "Multi-turn gateway auth: accepts a policy for a route added in the same operation"
    vars:
      conversation:
        - role: user
          content: Add gateway auth to the app namespace for st-ethos.
        - role: assistant
          content:
            - type: text
              text: "👋 Hi! I'm the Nomos Agent. Give me a moment while I look you up…"
            - type: tool_use
              id: toolu_01
              name: get_me
              input: {}
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolu_01
              content: '{"login":"brettcurtis","email":"brett@osinfra.io"}'
        - role: assistant
          content:
            - type: tool_use
              id: toolu_02
              name: lookup_user
              input:
                github_username: brettcurtis
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolu_02
              content: '{"matches":[{"team_key":"st-ethos","roles":["github_parent_team.maintainers"]}]}'
        - role: assistant
          content:
            - type: tool_use
              id: toolu_03
              name: lookup_user
              input:
                email: brett@osinfra.io
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolu_03
              content: '{"matches":[{"team_key":"st-ethos","roles":["google_groups.admin.owners"]}]}'
        - role: assistant
          content:
            - type: text
              text: You're on st-ethos. Let me load the current spec and routes.
            - type: tool_use
              id: toolu_04
              name: get_team
              input:
                team_key: st-ethos
        - role: user
          content:
            - type: tool_result
              tool_use_id: toolu_04
              content: >-
                {"team_key":"st-ethos","platform_managed_project":{"kubernetes_engine":{"namespaces":{"app":{"istio_injection":"enabled","routes":{"app":{"path":"/app","port":8080,"service":"app"}}}}}}}
        - role: assistant
          content: "The mesh-enabled `app` namespace has one route: `app`. There are no existing browser policies in any namespace, so there is no shared-host policy conflict. The built-in Authentik group `all` is available for baseline access. Routes and their auth policies are collected together and applied as one spec, so you can add a new route and its policy at once."
        - role: user
          content: Add route api at /api on service api port 8080 and a browser policy for api requiring the built-in group all.
    assert:
      - type: javascript
        value: |
          const calls = Array.isArray(output) ? output : (output?.tool_calls || output?.content?.filter?.(c => c.type === 'tool_use') || []);
          const raw = typeof output === 'string' ? output : JSON.stringify(output);
          const names = [...new Set([...calls.map(c => c.function?.name || c.name).filter(Boolean), ...[...raw.matchAll(/"name"\s*:\s*"([^"]+)"/g)].map(m => m[1])])];
          return !names.includes('open_team_pr');
      - type: javascript
        value: |
          const _content = Array.isArray(output) ? output : output?.content;
          const text = typeof output === 'string' ? output : (Array.isArray(_content) ? _content.filter(c => c.type === 'text').map(c => c.text).join(' ') : (typeof _content === 'string' ? _content : ''));
          const lower = text.toLowerCase();
          const normalized = lower.replace(/[`*]/g, '');
          const clauses = normalized.split(/[;\n.!?]+/);
          let policySection = '';
          for (const line of normalized.split('\n')) {
            if (!line.trim()) continue;
            if (/^\s*[-+]\s/.test(line)) {
              if (policySection) policySection += ' ' + line;
            } else {
              if (policySection) clauses.push(policySection);
              policySection = /\b(?:(?:auth|browser)\s+policy\b.*\bapi\b|(?:new\s+)?route\s+(?:[-—:]\s*)?api\b)/.test(line) ? line : '';
            }
          }
          if (policySection) clauses.push(policySection);
          const apiGroupPolicy = clauses.some(clause =>
            /\bapi\b/.test(clause) &&
            /\b(?:required_groups|(?:required|allowed|requiring|requires)\s+(?:(?:authentik|built-in)\s+)?groups?)\s*(?:[:=|]\s*)?(?:\[\s*)?["']?all\b/.test(clause));
          return apiGroupPolicy &&
            (lower.includes('route_auth_policies') || lower.includes('gateway auth') || lower.includes('auth policy') || lower.includes('policy') || lower.includes('browser') || lower.includes('route')) &&
            (lower.includes('confirm') || lower.includes('pull request') || lower.includes('open the pr') || lower.includes('open a pr') || lower.includes(' pr?') || lower.includes('go ahead') || lower.includes('proceed') || lower.includes('shall i') || lower.includes('summary'));

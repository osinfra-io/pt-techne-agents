name: Promptfoo

on:
  pull_request:
    paths:
      - '.github/agents/**'
      - 'evals/**'
  workflow_dispatch:

concurrency:
  group: promptfoo-${{ github.head_ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  eval:
    name: Evaluations
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Promptfoo (first-turn)
        uses: promptfoo/promptfoo-action@04839e664f52212b877170219dab0d7ad2bf6440 # v1.3.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          config: evals/promptfooconfig.yaml
          disable-comment: true
          no-share: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Promptfoo (multi-turn)
        uses: promptfoo/promptfoo-action@04839e664f52212b877170219dab0d7ad2bf6440 # v1.3.4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          config: evals/promptfooconfig-multiturn.yaml
          disable-comment: true
          no-share: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Report failed evaluation details
        if: failure()
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          for (const file of fs.readdirSync('.').filter(name => /^output-.*\.json$/.test(name))) {
            const report = JSON.parse(fs.readFileSync(file, 'utf8'));
            for (const result of report.results.results.filter(result => !result.success)) {
              console.log(JSON.stringify({
                test: result.testCase.description,
                error: result.error,
                grading: result.gradingResult,
                response: result.response,
              }, null, 2));
            }
          }
          NODE
